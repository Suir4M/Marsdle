<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0709">
  <title>Vampiredle</title>
  <meta name="description" content="Devine le personnage de The Vampire Diaries grâce aux indices : espèce, famille, saison…">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%9B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Fond d'écran : place ton image (portrait) dans images/fond.jpg -->
  <div class="wallpaper" aria-hidden="true">
    <img src="images/fond.jpg" alt="" onerror="this.remove()">
  </div>

  <main>
    <h1>Vampiredle</h1>

    <div id="home">
      <p class="tag">Devine les personnages de <i>The Vampire Diaries</i></p>
      <div class="cards">
        <button data-t="a"><i>🧛</i><b>Classique</b><small>Trouve le perso grâce aux indices</small></button>
        <button data-t="b"><i>💬</i><b>Citation</b><small>Qui a dit cette réplique ?</small></button>
      </div>
    </div>

    <button id="back" hidden>← Menu</button>
    <section id="a"></section>
    <section id="b"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/game.js"></script>
  <script src="js/classic-game.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home-button.js" data-href="../"></script>
</body>
</html>
